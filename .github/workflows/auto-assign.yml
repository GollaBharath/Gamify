name: Auto Assign Issue

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    name: Assign Contributor
    runs-on: ubuntu-latest
    if: (!github.event.issue.pull_request) && (contains(github.event.comment.body, '.take') || contains(github.event.comment.body, '/assign'))
    steps:
      - name: Assign commenter to issue
        uses: actions/github-script@v6
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;

            // Check if the issue is already assigned
            if (context.payload.issue.assignees && context.payload.issue.assignees.length > 0) {
              console.log('Issue is already assigned.');
              return;
            }

            // Assign the issue
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: [commenter]
            });

            // Post a confirmation comment
            const responseBody = `Assigning this issue to @${commenter}! Happy contributing! 🎉`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: responseBody
            });
