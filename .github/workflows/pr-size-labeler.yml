name: "PR Size Labeler"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  size-labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Size Labeler Action
        uses: pascalgn/size-label-action@v0.5.5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          sizes: |
            XS: 10
            S: 50
            M: 200
            L: 500
            XL: 1000
